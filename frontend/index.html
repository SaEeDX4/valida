    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Approved Valida brand assets (frontend/public/brand/), used unmodified.
      These replace the temporary empty data: icon from Milestone A1, which
      existed only to stop the automatic /favicon.ico 404 before the approved
      assets were available.
    -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/valida-app-icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/valida-app-icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/valida-app-icon-180.png" />
    <meta name="theme-color" content="#05070a" />
    <!--
      Per-route titles are set by the shared PageMeta helper using canonical
      Document 06 copy. Descriptions, canonical URLs and Open Graph tags are
      page-content concerns owned by A4 and need the production domain, which
      is still AWAITING INPUT (Document 14).
    -->
    <title>Valida</title>
