<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Approved Valida brand assets (frontend/public/brand/), used unmodified.
      These replace the temporary empty data: icon from Milestone A1, which
      existed only to stop the automatic /favicon.ico 404 before the approved
      assets were available.
    -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/valida-app-icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/valida-app-icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/valida-app-icon-180.png" />
    <meta name="theme-color" content="#05070a" />
    <!--
      Per-route metadata (title, description, robots, canonical, Open Graph,
      JobPosting) is described once, in src/seo/head.js. The document server
      (frontend/server/) writes it into this file's head for the initial HTML,
      in place of the title below and the valida:head marker; in the browser
      the shared PageMeta helper keeps it in step with the mounted route.
    -->
    <title>Valida</title>
    <!--valida:head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
