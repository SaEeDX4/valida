# clamd for the résumé scanner: loopback TCP only; VERSION enabled (the scanner reads the signature
# version and date before and after each scan); SHUTDOWN/RELOAD/STATS are not enabled by any setting here.
Foreground true
TCPSocket 3310
TCPAddr 127.0.0.1
User clamav
DatabaseDirectory /var/lib/clamav
LogTime true
LogFile /dev/stderr
StreamMaxLength 6M
MaxFileSize 6M
MaxScanSize 25M
EnableVersionCommand true
SelfCheck 0
